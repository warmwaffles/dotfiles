# theme = "tokyonight_moon"
theme = "catppuccin_mocha"

[editor]
line-number = "absolute"
jump-label-alphabet = "tnseriplfuwydhcxoaqz"

[editor.diagnostics.inline]
cursor-line = "error"

[editor.diagnostics.end-of-line]
severity = "hint"

[editor.rulers]
columns = [80, 100]

[editor.auto-pairs]
# This is an annoying feature to me, I want to be in
# charge of what I punch in. Yea you are saving me a
# key stroke...sometimes. But often, I'm an idiot and
# forgot to put parens or quotes while typing and I
# move back to fix that issue. It's a skill issue that
# I'm not fixing. Deal with it.
enable = false

[editor.inline-blame]
show = "cursor-line"
format = "{commit} • {date} • {author} • {title}"

[editor.cursor]
highlight-line = true

#
# NORMAL MODE
#

[editor.cursor.shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.files.save]
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.soft-wrap]
enable = true

[editor.whitespace.render]
space = "all"
tab = "none"
nbsp = "none"
nnbsp = "none"
newline = "none"

[editor.whitespace.characters]
space = " "
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·"  # Tabs will look like "→···" (depending on tab width)

[editor.indent-guides]
render = false
character = "╎"
skip-levels = 1

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
mode.color = true

[editor.file-picker]
hidden = false

[editor.lsp]
enable = true

[editor.lsp.signature-help]
auto-trigger = false

[editor.mouse]
enable = false

[editor.scroll]
padding = 7

[keys.normal]
# Shift-l and -h to move through tabs
"}" = ":buffer-next"
"{" = ":buffer-previous"
# Shift the current line up and down
# C-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
# C-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-S-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-S-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
# Toggle comment
"C-/" = "toggle_comments"
# Duplicate current line
"C-S-d" = ["extend_to_line_bounds", "yank", "paste_after"]
# Close the buffer
S-y = ":clipboard-yank"
C-r = ":reload"
F5 = ":reload"
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
S-left = "extend_char_left"
S-right = "extend_char_right"
S-up = "extend_line_up"
S-down = "extend_line_down"
# Scroll
C-up = ["move_line_up", "scroll_up"]
C-down = ["move_line_down", "scroll_down"]
C-k = ["move_line_up", "scroll_up"]
C-j = ["move_line_down", "scroll_down"]
C-p = "half_page_up"
C-n = "half_page_down"
V = ["goto_first_nonwhitespace", "extend_to_line_end"]
D = "kill_to_line_end"
S-end = ["ensure_selections_forward", "extend_to_line_end"]
C-space = "signature_help"
X = "extend_line_above"
F12 = ":format"
C-h = ":toggle-option file-picker.hidden"
C-m = ":toggle-option soft-wrap.enable"

[keys.normal."["]
b = "goto_previous_buffer"

[keys.normal."]"]
b = "goto_next_buffer"

[keys.normal.space]
"F" = "file_picker_in_current_buffer_directory"

# UI Settings and stuff
[keys.normal.space.u]
h = ":toggle lsp.display-inlay-hints"

#
# INSERT MODE
#

[keys.normal.backspace]
d = "delete_selection_noyank"
c = "change_selection_noyank"
y = ":yank-diagnostic"

[keys.select]
"C-/" = "toggle_comments"
S-y = ":clipboard-yank"
S-left = "extend_char_left"
S-right = "extend_char_right"
S-up = "extend_line_up"
S-down = "extend_line_down"
tab = "trim_selections"
X = "extend_line_above"
ret = "extend_to_word"
";" = ["collapse_selection", "normal_mode"]

[keys.select."["]
b = "goto_previous_buffer"

[keys.select."]"]
b = "goto_next_buffer"

[keys.insert]
C-e = ":insert-output comment-signature"
"A-," = "unindent"
"A-." = "indent"
C-p = "paste_before"
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
C-space = "signature_help"
tab = "insert_tab"

#
# SELECT MODE
#

#
# Custom Commands
# https://mitos.computer/docs/custom-commands
#
[commands]
# Because I am really stupid when I type
":Wq" = [":write", ":quit"]

[terminal]
undercurl = true
